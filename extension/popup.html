<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><title>Video Translator</title></head><body><small>VIDEO TRANSLATOR</small><h1>Watch in your language.</h1><p>Translate first. Then play in sync.</p><label>Video<select id="video"></select></label><p id="source"></p><label>Target language<select id="language"><option>Simplified Chinese</option><option>English</option><option>Spanish</option><option>Japanese</option><option>French</option></select></label><details><summary>Use a matching source file</summary><input id="file" type="file" accept="audio/*,video/*"><label><input id="confirmed" type="checkbox"> This file matches the selected video.</label></details><button id="start">Translate video</button><button id="play" hidden>Play translated</button><button id="cancel" class="secondary">Cancel</button><button id="original" class="secondary">Use original audio</button><p id="status" role="status">Detecting videos…</p><button id="settings" class="secondary">Providers & keys</button><script type="module" src="popup.js"></script></body></html>
